{{- if and .Values.applicationSet .Values.applicationSet.enabled .Values.applicationSet.appProject.enabled }}
{{- $appProject := .Values.applicationSet.appProject | default dict }}
{{- $destinations := $appProject.destinations | default list }}
{{- $sourceRepos := $appProject.sourceRepos | default list }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ $appProject.name | default .Values.applicationSet.project }}
  namespace: {{ .Values.applicationSet.namespace | default (.Values.namespaces.argocd | default "argocd") }}
spec:
  description: {{ $appProject.description | default "AppProject for repo-registration ApplicationSet." | quote }}
  sourceRepos:
    {{- range $repo := $sourceRepos }}
    - {{ $repo | quote }}
    {{- end }}
  destinations:
    {{- range $dest := $destinations }}
    - server: {{ $dest.server | quote }}
      namespace: {{ $dest.namespace | quote }}
    {{- end }}
  {{- if $appProject.clusterResourceWhitelist }}
  clusterResourceWhitelist:
    {{- range $entry := $appProject.clusterResourceWhitelist }}
    - group: {{ $entry.group | quote }}
      kind: {{ $entry.kind | quote }}
    {{- end }}
  {{- else if $appProject.clusterResourceBlacklist }}
  clusterResourceBlacklist:
    {{- range $entry := $appProject.clusterResourceBlacklist }}
    - group: {{ $entry.group | quote }}
      kind: {{ $entry.kind | quote }}
    {{- end }}
  {{- end }}
  {{- if $appProject.namespaceResourceWhitelist }}
  namespaceResourceWhitelist:
    {{- range $entry := $appProject.namespaceResourceWhitelist }}
    - group: {{ $entry.group | quote }}
      kind: {{ $entry.kind | quote }}
    {{- end }}
  {{- end }}
{{- end }}
