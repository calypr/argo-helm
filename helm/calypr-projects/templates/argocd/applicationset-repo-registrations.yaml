{{- if and .Values.applicationSet .Values.applicationSet.enabled }}
{{- $generator := .Values.applicationSet.generator | default dict }}
{{- $template := .Values.applicationSet.template | default dict }}
{{- $destination := .Values.applicationSet.destination | default dict }}
{{- $syncPolicy := .Values.applicationSet.syncPolicy | default dict }}
{{- $automated := $syncPolicy.automated | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.applicationSet.name | default "repo-registrations" }}
  namespace: {{ .Values.applicationSet.namespace | default (.Values.namespaces.argocd | default "argocd") }}
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ required "applicationSet.generator.repoURL is required" $generator.repoURL | quote }}
        revision: {{ $generator.revision | default "main" | quote }}
        files:
          - path: {{ $generator.path | default "environments/test/*.yaml" | quote }}
  template:
    metadata:
      name: "calypr-projects-{{`{{.path.basenameNormalized}}`}}"
      labels:
        app.kubernetes.io/part-of: calypr-projects
        app.kubernetes.io/managed-by: applicationset
    spec:
      project: {{ .Values.applicationSet.project | default "default" }}
      sources:
        - repoURL: {{ required "applicationSet.template.repoURL is required" $template.repoURL | quote }}
          targetRevision: {{ $template.targetRevision | default "main" | quote }}
          path: {{ $template.path | default "helm/calypr-projects" | quote }}
          helm:
            valueFiles:
              - "$values/{{`{{.path.path}}`}}"
        - repoURL: {{ required "applicationSet.generator.repoURL is required" $generator.repoURL | quote }}
          targetRevision: {{ $generator.revision | default "main" | quote }}
          ref: values
      destination:
        server: {{ $destination.server | default "https://kubernetes.default.svc" | quote }}
        namespace: {{ $destination.namespace | default (.Values.namespaces.argocd | default "argocd") | quote }}
      syncPolicy:
        automated:
          prune: {{ $automated.prune | default true }}
          selfHeal: {{ $automated.selfHeal | default true }}
        {{- if $syncPolicy.syncOptions }}
        syncOptions:
          {{- toYaml $syncPolicy.syncOptions | nindent 10 }}
        {{- end }}
{{- end }}
