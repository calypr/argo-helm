{{- $reg := .Values.repoRegistration -}}
{{- if and .Values.events.enabled $reg -}}
{{- $tenantNs := printf "wf-%s" (replace "/" "-" $reg.full_name) -}}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: {{ printf "dispatch-%s" $reg.name | quote }}
  namespace: {{ .Values.events.namespace | default "argo-events" | quote }}
spec:
  dependencies:
    - name: repo-push
      eventSourceName: {{ .Values.events.eventSourceName | default "github-app-webhooks" | quote }}
      eventName: {{ .Values.events.eventName | default "github" | quote }}
      filters:
        data:
          - path: header.X-GitHub-Event
            type: string
            value: ["push"]
          - path: body.repository.full_name
            type: string
            value: [{{ $reg.full_name | quote }}]
  triggers:
    - template:
        name: submit-workflow
        conditions: "repo-push"
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: {{ printf "%s-" $reg.name | quote }}
                namespace: {{ $tenantNs | quote }}
              spec:
                serviceAccountName: {{ .Values.workflows.runnerServiceAccount | default "wf-runner" | quote }}
                workflowTemplateRef:
                  name: {{ $reg.workflowTemplateRef | default "nextflow-repo-runner" | quote }}
                arguments:
                  parameters:
                    - name: repo-name
                      value: {{ $reg.name | quote }}
                    - name: repo-url
                      value: {{ $reg.repoUrl | quote }}
                    - name: installation-id
                      value: ""
                    - name: git-ref
                      value: ""
                    - name: git-before
                      value: ""
                    - name: git-after
                      value: ""
{{- end -}}
